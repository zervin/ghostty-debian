name: Review upstream Ghostty release
on:
  schedule:
    - cron: '23 8 * * *'
  workflow_dispatch:
    inputs:
      reviewer_self_test:
        description: Test the real bot-dispatched reviewer without creating or merging PRs
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: check-upstream
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/main' && inputs.reviewer_self_test != true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      available: ${{ steps.candidate.outputs.available }}
      version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Check verified stable upstream tags
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-upstream.py --check | tee "$RUNNER_TEMP/candidate.json"
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          data = json.loads((Path(os.environ['RUNNER_TEMP']) / 'candidate.json').read_text())
          assert re.fullmatch(r'(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)', data['version'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f"available={str(data['update_available']).lower()}\nversion={data['version']}\n")
          PY

  propose:
    needs: check
    if: github.ref == 'refs/heads/main' && needs.check.outputs.available == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      # This is the trusted workflow commit, never the proposed branch or PR contents.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Propose reviewed inputs without replacing an existing branch
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.check.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          [[ $VERSION =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          BRANCH="automation/ghostty-$VERSION"
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/heads/$BRANCH" --jq '.[].ref')
          if [[ -n $existing ]]; then
            echo "Branch $BRANCH already exists; leaving its changes and PR untouched."
            pr=$(gh pr list --repo "$GH_REPO" --head "$BRANCH" --base main --state open --json number,headRefOid --jq 'if length == 1 then .[0] else empty end')
            if [[ -n $pr ]]; then
              number=$(jq -r .number <<< "$pr")
              head=$(jq -r .headRefOid <<< "$pr")
              [[ $number =~ ^[1-9][0-9]*$ && $head =~ ^[0-9a-f]{40}$ ]]
              gh workflow run gated-update.yml --repo "$GH_REPO" --ref main -f pr_number="$number" -f expected_head_sha="$head"
            fi
            exit 0
          fi
          python3 scripts/check-upstream.py --update --expected-version "$VERSION"
          git switch -c "$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- release.conf debian/changelog
          git commit -m "Review Ghostty $VERSION stable release inputs"
          gh auth setup-git
          # No force push: a concurrent or foreign branch must never be overwritten.
          git push origin "HEAD:refs/heads/$BRANCH"
          gh pr create --repo "$GH_REPO" --base main --head "$BRANCH" \
            --title "Review Ghostty $VERSION stable release" \
            --body 'Verified stable upstream release proposal. The pinned compiler and infrastructure are unchanged. Automatic merging requires strict metadata validation, premerge package tests and an explicit complete Claude approval for this exact head. Significant findings, missing/failed reviews, stale heads and incomplete evidence block merging. Successful gated merges explicitly dispatch the release workflow.'
          number=$(gh pr view "$BRANCH" --repo "$GH_REPO" --json number --jq .number)
          head=$(git rev-parse HEAD)
          [[ $number =~ ^[1-9][0-9]*$ && $head =~ ^[0-9a-f]{40}$ ]]
          gh workflow run gated-update.yml --repo "$GH_REPO" --ref main -f pr_number="$number" -f expected_head_sha="$head"

  reviewer-self-test:
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.reviewer_self_test == true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Exercise the same bot identity used for automated update reviews
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow run gated-update.yml --repo "$GH_REPO" --ref main -f mode=self-test
