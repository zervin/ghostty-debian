name: Reviewed Debian package
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit required by automated merge dispatch
        type: string
        default: ''
  push:
    branches: [main]
    paths:
      - release.conf
      - 'debian/**'
      - 'scripts/**'
      - 'tests/**'
      - Dockerfile
      - .github/workflows/release.yml

permissions:
  contents: read

concurrency:
  group: manual-debian-release
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    permissions:
      contents: read
    outputs:
      version: ${{ steps.metadata.outputs.version }}
      tag: ${{ steps.metadata.outputs.tag }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Require the dispatched immutable main commit
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          ACTUAL_SHA: ${{ github.sha }}
        run: |
          [[ -z $EXPECTED_SHA || ( $EXPECTED_SHA =~ ^[0-9a-f]{40}$ && $EXPECTED_SHA == "$ACTUAL_SHA" ) ]]
      - name: Static checks
        run: bash tests/static.sh
      - name: Trusted release identifiers
        id: metadata
        run: python3 scripts/release-metadata.py
      - name: Build, lint, and fresh-container smoke test
        run: bash scripts/build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ghostty-debian
          path: artifacts/*
          if-no-files-found: error
          retention-days: 30

  publish:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      # Clean runner: no checkout, no build scripts, and never execute downloaded files.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: ghostty-debian
          path: ${{ runner.temp }}/release
      - name: Upload completely, then publish this verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TARGET_SHA: ${{ github.sha }}
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
          RELEASE_TAG: ${{ needs.build.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ $TARGET_SHA =~ ^[0-9a-f]{40}$ ]]
          [[ $PACKAGE_VERSION =~ ^[0-9]+\.[0-9]+\.[0-9]+-[0-9]+personal[0-9]+\.deb13u[0-9]+$ ]]
          [[ $RELEASE_TAG == "ghostty-${PACKAGE_VERSION}" ]]
          [[ -f "$RUNNER_TEMP/release/ghostty_${PACKAGE_VERSION}_amd64.deb" ]]
          [[ -f "$RUNNER_TEMP/release/SHA256SUMS" ]]
          # Refuse unexpected paths. Data files are uploaded, never sourced or executed.
          for file in "$RUNNER_TEMP/release/"*; do
            [[ -s $file && -f $file && ! -L $file ]]
            name=${file##*/}
            [[ $name =~ ^[a-zA-Z0-9._-]+$ ]]
          done
          (cd "$RUNNER_TEMP/release" && sha256sum --check --strict SHA256SUMS)
          # Refuse an existing tag rather than attaching a release to an older commit.
          existing=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$RELEASE_TAG" --jq '.[].ref')
          if [[ -n $existing ]]; then
            echo 'Release tag already exists; review and increment packaging version' >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" "$RUNNER_TEMP/release/"* \
            --repo "$GH_REPO" --target "$TARGET_SHA" --draft \
            --title "Ghostty $PACKAGE_VERSION — Debian 13 amd64" \
            --notes 'Independent personal ReleaseFast build for my own risk tolerances, not an official Ghostty or Debian package or a security audit. Verified signed upstream source and compiler, offline compilation, lintian and clean-container tests passed. Automatic upstream updates additionally require strict metadata validation and an explicit Claude review. Runtime safety checks are disabled; bundled libraries are not serviced by Debian updates. See README, SECURITY.md and attached build records. Automated checks are headless; future GUI/GPU behavior is not guaranteed.'
          # Never expose a partial upload as a public release.
          gh release edit "$RELEASE_TAG" --repo "$GH_REPO" --draft=false --latest
